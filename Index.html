      if (state.dirty && !(await confirmDialog('Tienes cambios sin guardar. Si vuelves a la lista, se perderán.', { title: 'Cambios sin guardar', confirmText: 'Descartar y volver', cancelText: 'Seguir editando', danger: true }))) return;
      state.dirty = false;
      loadStudentList();
    }

    /* ═══════════════════════════════════════════
       RENDER: Form View
    ═══════════════════════════════════════════ */
    function renderFormView() {
      document.getElementById('btnBack').style.display = '';
      document.getElementById('formToolbar').style.display = 'flex';
      var contentEl = document.getElementById('content');
      contentEl.className = 'content-with-nav';
      updateBadge();

      var selectedAreaNames = state.areas.map(function(a) { return a.name; });

      // ─── Side Nav ───
      var nav = '<nav class="side-nav">';
      nav += '<div class="side-nav-title">Programa</div>';
      nav += '<a onclick="scrollToId(\'secDatos\')">Datos del alumno</a>';
      if (state.areas.length) {
        nav += '<div class="side-nav-title side-nav-title--sub">Ámbitos</div>';
        state.areas.forEach(function(area, i) {
          var navColor = getAreaColor(area.name);
          nav += '<a class="nav-area" style="--area-color:' + navColor.headerBg + '" onclick="scrollToId(\'area_' + i + '\')">' + escHtml(shortAreaName(area.name)) + '</a>';
        });
      }
      nav += '<div class="side-nav-title side-nav-title--sub">Evaluación</div>';
      nav += '<a class="nav-section" onclick="scrollToId(\'secValoracion\')">Valoración inicial</a>';
      nav += '<a class="nav-section" onclick="scrollToId(\'secSeg1T\')">Seguimiento 1T</a>';
      nav += '<a class="nav-section" onclick="scrollToId(\'secSeg2T\')">Seguimiento 2T</a>';
      nav += '<a class="nav-section" onclick="scrollToId(\'secSeg3T\')">Seguimiento 3T</a>';
      nav += '<a class="nav-section" onclick="scrollToId(\'secInforme\')">Informe familias</a>';
      nav += '</nav>';

      // ─── Main content ───
      let html = nav + '<div class="content-main">';

      // ─── Student Info Card ───
      html += '<div class="card" id="secDatos"><div class="card-body">';
      html += '<div class="card-title"><span class="card-icon">' + ICONS.user + '</span> Datos del alumno/a</div>';
      html += '<div class="grid-2">';
      html += '<div><label class="field-label">Nombre del alumno/a *</label>';
      html += '<input class="field-input" id="fName" value="' + escAttr(state.studentName) + '" placeholder="Nombre y apellidos" oninput="onFieldChange()" ' + (state.selectedStudent && !state.isNew ? 'readonly' : '') + '></div>';
      html += '<div><label class="field-label">Curso *</label>';
      html += '<select class="field-select" id="fCourse" onchange="onFieldChange()"><option value="">Selecciona curso</option>';
      COURSES.forEach(function(c) { html += '<option value="' + c + '"' + (state.course === c ? ' selected' : '') + '>' + c + '</option>'; });
      html += '</select></div>';
      html += '</div>';

      // Areas (multi-select checkboxes)
      html += '<div style="margin-top:18px">';
      html += '<label class="field-label">Ámbitos de trabajo *</label>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">';
      AREAS.forEach(function(a) {
        var checked = selectedAreaNames.indexOf(a) >= 0;
        html += '<label class="area-check' + (checked ? ' is-checked' : '') + '">';
        html += '<input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleArea(\'' + escAttr(a) + '\')">';
        html += escHtml(a) + '</label>';
      });
      html += '</div></div>';
      html += '</div></div>';

      // ─── Areas with their objectives ───
      state.areas.forEach(function(area, areaIdx) {
        html += renderAreaSection(area, areaIdx);
      });

      // ─── Follow-up fields ───
      html += '<div class="followup-section-divider">Evaluación</div>';
      var followupFields = [
        { id: 'secValoracion', key: 'valoracionInicial', label: 'Valoración inicial', badge: svgIcon('pencil') },
        { id: 'secSeg1T', key: 'seguimiento1T', label: 'Seguimiento 1er Trimestre', badge: '1T' },
        { id: 'secSeg2T', key: 'seguimiento2T', label: 'Seguimiento 2º Trimestre', badge: '2T' },
        { id: 'secSeg3T', key: 'seguimiento3T', label: 'Seguimiento 3er Trimestre', badge: '3T' }
      ];
      followupFields.forEach(function(f) {
        html += '<div class="followup-card followup-card--evaluacion" id="' + f.id + '">';
        html += '<div class="followup-header"><span class="followup-badge">' + f.badge + '</span>' + escHtml(f.label) + '</div>';
        html += '<div class="richtext-wrap">';
        html += '<div class="richtext-toolbar">';
        html += '<button onmousedown="event.preventDefault();richExec(\'bold\')" title="Negrita"><b>N</b></button>';
        html += '<button onmousedown="event.preventDefault();richExec(\'italic\')" title="Cursiva"><i>K</i></button>';
        html += '<button onmousedown="event.preventDefault();richExec(\'insertUnorderedList\')" title="Viñetas">• Lista</button>';
        html += '</div>';
        html += '<div class="richtext-editor" contenteditable="true" data-key="' + f.key + '" oninput="updateFollowupRich(\'' + f.key + '\',this)" onblur="updateFollowupRich(\'' + f.key + '\',this)">' + sanitizeRich(state[f.key] || '') + '</div>';
        html += '</div>';
        html += '</div>';
      });

      // ─── Informe a las familias ───
      html += renderInformeFamilias();

      html += '</div>'; // close content-main

      contentEl.innerHTML = html;

      // Auto-resize observation and list textareas
      document.querySelectorAll('.ind-obs-textarea, .list-textarea').forEach(function(ta) { autoResize(ta); });
    }

    function scrollToId(id) {
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function updateFollowup(key, value) {
      state[key] = value;
      markDirty();
    }

    function richExec(command) {
      document.execCommand(command, false, null);
    }

    function updateFollowupRich(key, el) {
      var html = el.innerHTML;
      if (state[key] === html) return;
      pushUndo({ coalesce: true });
      state[key] = html;
      markDirty();
    }

    // Modern palette per ámbito (orden canónico arriba en AREAS)
    var AREA_COLORS = {
      'Desarrollo Cognitivo':                   { headerBg: '#dc2626' }, // rojo
      'Desarrollo Comunicativo y Lingüístico':  { headerBg: '#2563eb' }, // azul
      'Desarrollo de la Autonomía Personal':    { headerBg: '#059669' }, // verde
      'Desarrollo Social y Emocional':          { headerBg: '#db2777' }, // rosa
      'Desarrollo Psicomotor':                  { headerBg: '#ea580c' }, // naranja
      'Desarrollo Motor':                       { headerBg: '#92400e' }  // marrón
    };
    var AREA_COLOR_DEFAULT = { headerBg: '#1b4332' };

    function getAreaColor(areaName) {
      return AREA_COLORS[areaName] || AREA_COLOR_DEFAULT;
    }

    // Nombre corto para navegación (sin "Desarrollo " ni preposición inicial)
    function shortAreaName(areaName) {
      return areaName.replace(/^Desarrollo\s+(de\s+las?\s+|del\s+)?/i, '');
    }

    // Ordena state.areas según el orden canónico de AREAS
    function sortAreasCanonical() {
      state.areas.sort(function(a, b) {
        return AREAS.indexOf(a.name) - AREAS.indexOf(b.name);
      });
    }

    function renderAreaSection(area, areaIdx) {
      var color = getAreaColor(area.name);

      var html = '<div class="area-wrap" id="area_' + areaIdx + '">';
      html += '<div class="area-header" style="background:' + color.headerBg + '">';
      html += '<span class="area-title">' + escHtml(area.name) + ' <span class="area-count">(' + area.objectives.length + ' obj.)</span></span>';
      html += '<button class="btn-collapse-area" id="collapseArea_' + areaIdx + '" onclick="toggleAreaCollapse(' + areaIdx + ')" title="Colapsar o expandir todos los objetivos de este ámbito">Colapsar todo</button>';
      html += '</div>';

      area.objectives.forEach(function(obj, i) {
        html += renderObjectiveCard(obj, i, areaIdx, color);
      });

      html += '<button class="btn-add-obj" onclick="addObjective(' + areaIdx + ')">' + svgIcon('plus') + ' Añadir objetivo a ' + escHtml(area.name) + '</button>';
      html += '</div>';
      return html;
    }

    function renderObjectiveCard(obj, index, areaIdx, color) {
      var area = state.areas[areaIdx];
      var canRemove = area.objectives.length > 1;

      var html = '<div class="obj-card" id="obj_' + obj.id + '">';

      // Header
      html += '<div class="obj-header" onclick="toggleObjective(\'' + obj.id + '\')">';
      html += '<div style="display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1">';
      html += '<span class="obj-num" style="margin-top:2px">' + (index + 1) + '</span>';
      html += '<div style="display:flex;flex-direction:column;min-width:0;flex:1">';
      html += '<span class="obj-title-text" contenteditable="true" spellcheck="true"'
           + ' data-placeholder="Escribe el objetivo..."'
           + ' onclick="event.stopPropagation()"'
           + ' onfocus="event.stopPropagation()"'
           + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
           + ' oninput="updateObjTitle(\'' + obj.id + '\',this.textContent)">'
           + escHtml(obj.title) + '</span>';
      html += renderObjProgress(obj);
      html += '</div>';
      html += '</div>';
      html += '<div class="obj-actions">';
      var isFirst = index === 0;
      var isLast = index === area.objectives.length - 1;
      html += '<button class="btn-move-obj" onclick="event.stopPropagation();moveObjective(' + areaIdx + ',\'' + obj.id + '\',-1)" title="Subir objetivo" aria-label="Subir objetivo"' + (isFirst ? ' disabled' : '') + '>' + ICONS.arrowUp + '</button>';
      html += '<button class="btn-move-obj" onclick="event.stopPropagation();moveObjective(' + areaIdx + ',\'' + obj.id + '\',1)" title="Bajar objetivo" aria-label="Bajar objetivo"' + (isLast ? ' disabled' : '') + '>' + ICONS.arrowDown + '</button>';
      if (canRemove) {
        html += '<button class="btn-remove-obj" title="Eliminar objetivo" aria-label="Eliminar objetivo" onclick="event.stopPropagation();removeObjective(' + areaIdx + ',\'' + obj.id + '\')">' + ICONS.trash + '</button>';
      }
      html += '<span class="obj-toggle" id="toggle_' + obj.id + '">' + ICONS.chevronDown + '</span>';
      html += '</div></div>';

      // Body
      html += '<div class="obj-body" id="body_' + obj.id + '">';

      // Indicators
      html += '<div class="section section-indicators">';
      html += '<div class="section-label">Indicadores de evaluación</div>';
      html += '<div class="section-legend">';
      html += '<span><span class="eval-tag eval-tag-ni">NI</span> No iniciado</span>';
      html += '<span><span class="eval-tag eval-tag-ep">EP</span> En proceso</span>';
      html += '<span><span class="eval-tag eval-tag-c">C</span> Conseguido</span>';
      html += '</div>';
      html += renderDynamicList(obj.id, 'indicators', obj.indicators, 'Ej: Mantiene la atención durante 10-15 min...');
      html += '</div>';

      // Contents (list of rich-text blocks)
      html += '<div class="section section-contents">';
      html += '<div class="section-label">Contenidos</div>';
      html += renderContentsList(obj.id, obj.contents);
      html += '</div>';

      // Activities (single rich-text)
      html += '<div class="section section-activities">';
      html += '<div class="section-label">Actividades</div>';
      html += renderObjRichField(obj.id, 'activities', obj.activities, 'Ej: Subrayado guiado de datos relevantes...');
      html += '</div>';

      html += '</div></div>';
      return html;
    }

    function renderDynamicList(objId, listType, items, placeholder) {
      var isIndicator = (listType === 'indicators');
      var html = '';
      if (isIndicator && items.length > 0) {
        html += '<div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:4px;padding-right:38px">';
        html += '<span class="eval-label" style="width:56px">1T</span>';
        html += '<span class="eval-label" style="width:56px">2T</span>';
        html += '<span class="eval-label" style="width:56px">3T</span>';
        html += '</div>';
      }
      var soloClass = (items.length <= 1) ? ' has-one' : '';
      html += '<div class="dynamic-list' + soloClass + '" id="list_' + objId + '_' + listType + '">';
      items.forEach(function(item, idx) {
        html += renderListItem(objId, listType, item, idx, placeholder, items.length);
      });
      html += '</div>';
      html += '<button class="btn-add-item" onclick="addListItem(\'' + objId + '\',\'' + listType + '\')">' + ICONS.plus + ' Añadir</button>';
      return html;
    }

    function renderListItem(objId, listType, item, idx, placeholder, total) {
      var isIndicator = (listType === 'indicators');
      var html = '<div class="list-item-wrap" data-item-id="' + item.id + '">';
      html += '<div class="list-item">';
      html += '<span class="list-num">' + (idx + 1) + '</span>';
      html += '<textarea class="list-textarea" rows="1" placeholder="' + escAttr(placeholder) + '" oninput="autoResize(this);updateListItem(\'' + objId + '\',\'' + listType + '\',\'' + item.id + '\',this.value)">' + escHtml(item.text) + '</textarea>';
      if (isIndicator) {
        html += '<div class="eval-group">';
        html += renderEvalSelect(objId, item.id, '1T', item.eval1T || '');
        html += renderEvalSelect(objId, item.id, '2T', item.eval2T || '');
        html += renderEvalSelect(objId, item.id, '3T', item.eval3T || '');
        html += '</div>';
      }
      if (isIndicator) {
        var isFirst = idx === 0;
        var isLast = (typeof total === 'number') ? (idx === total - 1) : false;
        html += '<div class="list-move-group">';
        html += '<button class="btn-move-item" title="Subir" aria-label="Subir" onclick="moveListItem(\'' + objId + '\',\'' + listType + '\',\'' + item.id + '\',-1)"' + (isFirst ? ' disabled' : '') + '>' + ICONS.arrowUp + '</button>';
        html += '<button class="btn-move-item" title="Bajar" aria-label="Bajar" onclick="moveListItem(\'' + objId + '\',\'' + listType + '\',\'' + item.id + '\',1)"' + (isLast ? ' disabled' : '') + '>' + ICONS.arrowDown + '</button>';
        html += '</div>';
      }
      html += '<button class="btn-remove-item" title="Eliminar" aria-label="Eliminar" onclick="removeListItem(\'' + objId + '\',\'' + listType + '\',\'' + item.id + '\')">' + ICONS.x + '</button>';
      html += '</div>';
      if (isIndicator) {
        html += '<div style="margin-left:28px;margin-bottom:8px">';
        html += '<textarea class="ind-obs-textarea" rows="1" placeholder="Observaciones del indicador..." oninput="autoResize(this);updateIndicatorObs(\'' + objId + '\',\'' + item.id + '\',this.value)">' + escHtml(item.observaciones || '') + '</textarea>';
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    function renderContentsList(objId, items) {
      var html = '<div class="contents-list" id="contents_' + objId + '">';
      items.forEach(function(item, idx) {
        html += renderContentItem(objId, item, idx, items.length);
      });
      html += '</div>';
      html += '<button class="btn-add-item" onclick="addContentItem(\'' + objId + '\')">' + ICONS.plus + ' Añadir contenido</button>';
      return html;
    }

    function renderContentItem(objId, item, idx, total) {
      var editorId = 'rich_' + objId + '_contents_' + item.id;
      var canRemove = total > 1;
      var isFirst = idx === 0;
      var isLast = idx === total - 1;
      var html = '<div class="content-item" data-item-id="' + item.id + '">';
      html += '<span class="list-num content-num">' + (idx + 1) + '</span>';
      html += '<div class="richtext-wrap richtext-wrap-inline content-editor-wrap">';
      html += '<div class="richtext-toolbar">';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'bold\')" title="Negrita"><b>N</b></button>';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'italic\')" title="Cursiva"><i>K</i></button>';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'insertUnorderedList\')" title="Viñetas">• Lista</button>';
      html += '</div>';
      html += '<div id="' + editorId + '" class="richtext-editor richtext-editor-inline" contenteditable="true"'
           + ' data-obj-id="' + objId + '" data-content-item-id="' + item.id + '"'
           + ' data-placeholder="Ej: Resolución de problemas, numeración..."'
           + ' oninput="updateContentItem(\'' + objId + '\',\'' + item.id + '\',this)"'
           + ' onblur="updateContentItem(\'' + objId + '\',\'' + item.id + '\',this)">'
           + sanitizeRich(item.text || '') + '</div>';
      html += '</div>';
      html += '<div class="list-move-group">';
      html += '<button class="btn-move-item" title="Subir" aria-label="Subir" onclick="moveContentItem(\'' + objId + '\',\'' + item.id + '\',-1)"' + (isFirst ? ' disabled' : '') + '>' + ICONS.arrowUp + '</button>';
      html += '<button class="btn-move-item" title="Bajar" aria-label="Bajar" onclick="moveContentItem(\'' + objId + '\',\'' + item.id + '\',1)"' + (isLast ? ' disabled' : '') + '>' + ICONS.arrowDown + '</button>';
      html += '</div>';
      html += '<button class="btn-remove-item" title="Eliminar" aria-label="Eliminar"' + (canRemove ? '' : ' disabled style="visibility:hidden"') + ' onclick="removeContentItem(\'' + objId + '\',\'' + item.id + '\')">' + ICONS.x + '</button>';
      html += '</div>';
      return html;
    }

    function rerenderContentsList(objId) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var list = document.getElementById('contents_' + objId);
      if (!list) { renderFormView(); return; }
      list.innerHTML = '';
      found.obj.contents.forEach(function(item, i) {
        list.insertAdjacentHTML('beforeend', renderContentItem(objId, item, i, found.obj.contents.length));
      });
    }

    function updateContentItem(objId, itemId, el) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var item = found.obj.contents.find(function(c) { return c.id === itemId; });
      if (!item) return;
      var html = el.innerHTML;
      if (item.text === html) return;
      pushUndo({ coalesce: true });
      item.text = html;
      markDirty();
    }

    function addContentItem(objId) {
      var found = findObjInAreas(objId);
      if (!found) return;
      pushUndo();
      var newItem = { id: uid(), text: '' };
      found.obj.contents.push(newItem);
      markDirty();
      rerenderContentsList(objId);
      var ed = document.getElementById('rich_' + objId + '_contents_' + newItem.id);
      if (ed) ed.focus();
    }

    function removeContentItem(objId, itemId) {
      var found = findObjInAreas(objId);
      if (!found || found.obj.contents.length <= 1) return;
      pushUndo();
      found.obj.contents = found.obj.contents.filter(function(c) { return c.id !== itemId; });
      markDirty();
      rerenderContentsList(objId);
      showToast('Contenido eliminado', 'info', { action: 'Deshacer', onAction: undo, duration: 6000 });
    }

    function moveContentItem(objId, itemId, direction) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var arr = found.obj.contents;
      var idx = arr.findIndex(function(c) { return c.id === itemId; });
      if (idx < 0) return;
      var newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= arr.length) return;
      pushUndo();
      var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
      markDirty();
      rerenderContentsList(objId);
    }

    function renderObjRichField(objId, fieldKey, value, placeholder) {
      var editorId = 'rich_' + objId + '_' + fieldKey;
      var html = '<div class="richtext-wrap richtext-wrap-inline">';
      html += '<div class="richtext-toolbar">';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'bold\')" title="Negrita"><b>N</b></button>';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'italic\')" title="Cursiva"><i>K</i></button>';
      html += '<button type="button" onmousedown="event.preventDefault();richExecOn(\'' + editorId + '\',\'insertUnorderedList\')" title="Viñetas">• Lista</button>';
      html += '</div>';
      html += '<div id="' + editorId + '" class="richtext-editor richtext-editor-inline" contenteditable="true"'
           + ' data-obj-id="' + objId + '" data-obj-field="' + fieldKey + '"'
           + ' data-placeholder="' + escAttr(placeholder) + '"'
           + ' oninput="updateObjRich(\'' + objId + '\',\'' + fieldKey + '\',this)"'
           + ' onblur="updateObjRich(\'' + objId + '\',\'' + fieldKey + '\',this)">'
           + sanitizeRich(value || '') + '</div>';
      html += '</div>';
      return html;
    }

    function richExecOn(editorId, command) {
      var el = document.getElementById(editorId);
      if (el) el.focus();
      document.execCommand(command, false, null);
    }

    function updateObjRich(objId, fieldKey, el) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var html = el.innerHTML;
      if (found.obj[fieldKey] === html) return;
      pushUndo({ coalesce: true });
      found.obj[fieldKey] = html;
      markDirty();
    }

    function getPlaceholder(listType) {
      if (listType === 'indicators') return 'Ej: Mantiene la atención durante 10-15 min...';
      if (listType === 'contents') return 'Ej: Resolución de problemas, numeración...';
      return 'Ej: Subrayado guiado de datos relevantes...';
    }

    function renderObjProgress(obj) {
      var total = (obj.indicators || []).length;
      var trims = ['1T', '2T', '3T'];
      var html = '<div class="obj-eval-row" onclick="event.stopPropagation()">';
      trims.forEach(function(t) {
        var key = 'eval' + t;
        var value = obj[key] || '';
        var doneCount = obj.indicators ? obj.indicators.filter(function(i) { return (i[key] || '').trim(); }).length : 0;
        html += '<div class="obj-eval-item">';
        html += '<span class="obj-eval-label">' + t + '</span>';
        html += renderObjEvalSelect(obj.id, t, value);
        if (total > 0) {
          html += '<span class="obj-eval-count" title="Indicadores evaluados">' + doneCount + '/' + total + '</span>';
        }
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    function renderObjEvalSelect(objId, trimester, value) {
      var cls = 'eval-select obj-eval-select';
      if (value === 'NI') cls += ' eval-ni';
      else if (value === 'EP') cls += ' eval-ep';
      else if (value === 'C') cls += ' eval-c';
      var html = '<select class="' + cls + '" onchange="updateObjEval(\'' + objId + '\',\'' + trimester + '\',this)" onclick="event.stopPropagation()">';
      html += '<option value=""' + (!value ? ' selected' : '') + '>—</option>';
      html += '<option value="NI"' + (value === 'NI' ? ' selected' : '') + '>NI</option>';
      html += '<option value="EP"' + (value === 'EP' ? ' selected' : '') + '>EP</option>';
      html += '<option value="C"' + (value === 'C' ? ' selected' : '') + '>C</option>';
      html += '</select>';
      return html;
    }

    function updateObjEval(objId, trimester, selectEl) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var key = 'eval' + trimester;
      if (found.obj[key] === selectEl.value) return;
      pushUndo({ coalesce: true });
      found.obj[key] = selectEl.value;
      selectEl.className = 'eval-select obj-eval-select';
      if (selectEl.value === 'NI') selectEl.className += ' eval-ni';
      else if (selectEl.value === 'EP') selectEl.className += ' eval-ep';
      else if (selectEl.value === 'C') selectEl.className += ' eval-c';
      markDirty();
    }

    function renderEvalSelect(objId, itemId, trimester, value) {
      var cls = 'eval-select';
      if (value === 'NI') cls += ' eval-ni';
      else if (value === 'EP') cls += ' eval-ep';
      else if (value === 'C') cls += ' eval-c';
      var html = '<select class="' + cls + '" onchange="updateEval(\'' + objId + '\',\'' + itemId + '\',\'' + trimester + '\',this)">';
      html += '<option value=""' + (!value ? ' selected' : '') + '>—</option>';
      html += '<option value="NI"' + (value === 'NI' ? ' selected' : '') + '>NI</option>';
      html += '<option value="EP"' + (value === 'EP' ? ' selected' : '') + '>EP</option>';
      html += '<option value="C"' + (value === 'C' ? ' selected' : '') + '>C</option>';
      html += '</select>';
      return html;
    }

    function updateEval(objId, itemId, trimester, selectEl) {
      var found = findObjInAreas(objId);
      if (found) {
        var item = found.obj.indicators.find(function(i) { return i.id === itemId; });
        if (item) {
          var key = 'eval' + trimester;
          if (item[key] === selectEl.value) return;
          pushUndo({ coalesce: true });
          item[key] = selectEl.value;
          // Update visual class
          selectEl.className = 'eval-select';
          if (selectEl.value === 'NI') selectEl.className += ' eval-ni';
          else if (selectEl.value === 'EP') selectEl.className += ' eval-ep';
          else if (selectEl.value === 'C') selectEl.className += ' eval-c';
          refreshObjProgress(found.obj);
          markDirty();
        }
      }
    }

    function refreshObjProgress(obj) {
      var card = document.getElementById('obj_' + obj.id);
      if (!card) return;
      var prog = card.querySelector('.obj-header .obj-eval-row');
      if (!prog) return;
      var tmp = document.createElement('div');
      tmp.innerHTML = renderObjProgress(obj);
      var fresh = tmp.firstElementChild;
      if (fresh) prog.replaceWith(fresh);
    }

    /* ═══════════════════════════════════════════
       FORM ACTIONS
    ═══════════════════════════════════════════ */
    function onFieldChange() {
      var newName = document.getElementById('fName').value;
      var newCourse = document.getElementById('fCourse').value;
      if (state.studentName === newName && state.course === newCourse) return;
      pushUndo({ coalesce: true });
      state.studentName = newName;
      state.course = newCourse;
      markDirty();
    }

    async function toggleArea(areaName) {
      var idx = -1;
      for (var i = 0; i < state.areas.length; i++) {
        if (state.areas[i].name === areaName) { idx = i; break; }
      }
      if (idx >= 0) {
        var hasContent = state.areas[idx].objectives.some(function(o) { return o.title.trim(); });
        if (hasContent && !(await confirmDialog('Se eliminará el ámbito "' + areaName + '" y todos sus objetivos.', { title: 'Eliminar ámbito', confirmText: 'Eliminar', cancelText: 'Cancelar', danger: true }))) return;
        pushUndo();
        state.areas.splice(idx, 1);
      } else {
        pushUndo();
        state.areas.push({ name: areaName, objectives: [createEmptyObjective()] });
        sortAreasCanonical();
      }
      markDirty();
      renderFormView();
    }

    function markDirty() {
      state.dirty = true;
      updateBadge();
      scheduleDraftSave();
    }

    function updateBadge() {
      var badge = document.getElementById('studentBadge');
      var dirty = document.getElementById('badgeDirty');
      if (state.view === 'form' && (state.selectedStudent || state.studentName)) {
        badge.style.display = '';
        document.getElementById('badgeName').textContent = state.studentName || state.selectedStudent || 'Nuevo alumno';
        var courseEl = document.getElementById('badgeCourse');
        if (courseEl) {
          if (state.course) {
            courseEl.textContent = state.course;
            courseEl.style.display = '';
          } else {
            courseEl.style.display = 'none';
          }
        }
        dirty.style.display = state.dirty ? '' : 'none';
      } else {
        badge.style.display = 'none';
        dirty.style.display = 'none';
      }
      updateDraftIndicator();
    }

    function toggleObjective(objId) {
      var body = document.getElementById('body_' + objId);
      var toggle = document.getElementById('toggle_' + objId);
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        toggle.classList.remove('collapsed');
      } else {
        body.classList.add('hidden');
        toggle.classList.add('collapsed');
      }
    }

    function toggleAreaCollapse(areaIdx) {
      var area = state.areas[areaIdx];
      if (!area) return;
      var allCollapsed = area.objectives.every(function(o) {
        var body = document.getElementById('body_' + o.id);
        return body && body.classList.contains('hidden');
      });
      area.objectives.forEach(function(o) {
        var body = document.getElementById('body_' + o.id);
        var toggle = document.getElementById('toggle_' + o.id);
        if (!body || !toggle) return;
        if (allCollapsed) {
          body.classList.remove('hidden');
          toggle.classList.remove('collapsed');
        } else {
          body.classList.add('hidden');
          toggle.classList.add('collapsed');
        }
      });
      var btn = document.getElementById('collapseArea_' + areaIdx);
      if (btn) btn.textContent = allCollapsed ? 'Colapsar todo' : 'Expandir todo';
    }

    function moveObjective(areaIdx, objId, direction) {
      var area = state.areas[areaIdx];
      if (!area) return;
      var idx = area.objectives.findIndex(function(o) { return o.id === objId; });
      if (idx < 0) return;
      var newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= area.objectives.length) return;
      pushUndo();
      var tmp = area.objectives[idx];
      area.objectives[idx] = area.objectives[newIdx];
      area.objectives[newIdx] = tmp;
      markDirty();
      renderFormView();
    }

    function findObjInAreas(objId) {
      for (var a = 0; a < state.areas.length; a++) {
        var obj = state.areas[a].objectives.find(function(o) { return o.id === objId; });
        if (obj) return { area: state.areas[a], obj: obj };
      }
      return null;
    }

    function updateObjTitle(objId, value) {
      var found = findObjInAreas(objId);
      if (found && found.obj.title !== value) {
        pushUndo({ coalesce: true });
        found.obj.title = value;
        markDirty();
      }
    }

    function updateListItem(objId, listType, itemId, value) {
      var found = findObjInAreas(objId);
      if (found) {
        var item = found.obj[listType].find(function(i) { return i.id === itemId; });
        if (item && item.text !== value) {
          pushUndo({ coalesce: true });
          item.text = value;
          markDirty();
        }
      }
    }

    function updateIndicatorObs(objId, itemId, value) {
      var found = findObjInAreas(objId);
      if (found) {
        var item = found.obj.indicators.find(function(i) { return i.id === itemId; });
        if (item && item.observaciones !== value) {
          pushUndo({ coalesce: true });
          item.observaciones = value;
          markDirty();
        }
      }
    }

    function addListItem(objId, listType) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var newItem = { id: uid(), text: '' };
      if (listType === 'indicators') newItem.observaciones = '';
      found.obj[listType].push(newItem);
      markDirty();

      var list = document.getElementById('list_' + objId + '_' + listType);
      if (!list) { renderFormView(); return; }
      var arr = found.obj[listType];
      list.classList.remove('has-one');
      list.innerHTML = '';
      arr.forEach(function(item, i) {
        list.insertAdjacentHTML('beforeend', renderListItem(objId, listType, item, i, getPlaceholder(listType), arr.length));
      });
      list.querySelectorAll('.list-textarea, .ind-obs-textarea').forEach(function(ta) { autoResize(ta); });
      if (listType === 'indicators') refreshObjProgress(found.obj);
      var lastWrap = list.lastElementChild;
      var ta = lastWrap ? lastWrap.querySelector('.list-textarea') : null;
      if (ta) ta.focus();
    }

    function moveListItem(objId, listType, itemId, direction) {
      var found = findObjInAreas(objId);
      if (!found) return;
      var arr = found.obj[listType];
      var idx = arr.findIndex(function(i) { return i.id === itemId; });
      if (idx < 0) return;
      var newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= arr.length) return;
      pushUndo();
      var tmp = arr[idx];
      arr[idx] = arr[newIdx];
      arr[newIdx] = tmp;
      markDirty();

      var list = document.getElementById('list_' + objId + '_' + listType);
      if (!list) { renderFormView(); return; }
      list.innerHTML = '';
      arr.forEach(function(item, i) {
        list.insertAdjacentHTML('beforeend', renderListItem(objId, listType, item, i, getPlaceholder(listType), arr.length));
      });
      list.querySelectorAll('.list-textarea, .ind-obs-textarea').forEach(function(ta) { autoResize(ta); });
      if (listType === 'indicators') refreshObjProgress(found.obj);
    }

    function removeListItem(objId, listType, itemId) {
      var found = findObjInAreas(objId);
      if (!found || found.obj[listType].length <= 1) return;
      pushUndo();
      found.obj[listType] = found.obj[listType].filter(function(i) { return i.id !== itemId; });
      markDirty();

      var list = document.getElementById('list_' + objId + '_' + listType);
      if (!list) { renderFormView(); return; }
      var arr = found.obj[listType];
      list.innerHTML = '';
      arr.forEach(function(item, i) {
        list.insertAdjacentHTML('beforeend', renderListItem(objId, listType, item, i, getPlaceholder(listType), arr.length));
      });
      list.querySelectorAll('.list-textarea, .ind-obs-textarea').forEach(function(ta) { autoResize(ta); });
      if (arr.length <= 1) list.classList.add('has-one');
      if (listType === 'indicators') refreshObjProgress(found.obj);

      var label = listType === 'indicators' ? 'Indicador' : listType === 'contents' ? 'Contenido' : 'Actividad';

    function addObjective(areaIdx) {
      state.areas[areaIdx].objectives.push(createEmptyObjective());

      renderFormView();
      showToast('Objetivo añadido', 'success');

    async function removeObjective(areaIdx, objId) {
      var area = state.areas[areaIdx];
      if (area.objectives.length <= 1) return;
      if (!(await confirmDialog('Se eliminará el objetivo y sus indicadores, contenidos y actividades.', { title: 'Eliminar objetivo', confirmText: 'Eliminar', cancelText: 'Cancelar', danger: true }))) return;
      pushUndo();
      area.objectives = area.objectives.filter(function(o) { return o.id !== objId; });
      markDirty();
      renderFormView();
      showToast('Objetivo eliminado', 'info', { action: 'Deshacer', onAction: undo, duration: 6000 });

    function createEmptyObjective() {
      return {
        id: uid(),
        title: '',
        eval1T: '', eval2T: '', eval3T: '',
        indicators: [{ id: uid(), text: '', observaciones: '' }],
        contents: [{ id: uid(), text: '' }],
        activities: ''
      };
    }

    // Normalize a list-of-blocks field: accepts array [{text}], legacy string, or empty.
    function normalizeContentsField(value) {
      if (Array.isArray(value)) {
        var arr = value.map(function(x) { return { id: uid(), text: (x && x.text) ? String(x.text) : '' }; });
        if (arr.length === 0) arr.push({ id: uid(), text: '' });
        return arr;
      }
      if (typeof value === 'string' && value.trim()) {
        return [{ id: uid(), text: value }];
      }
      return [{ id: uid(), text: '' }];
    }

    // Normalize a single rich-text field: accepts string, legacy array, or empty.
    function normalizeRichField(value) {
      if (value == null) return '';
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) {
        var items = value.map(function(x) { return (x && x.text) ? String(x.text).trim() : ''; })
                         .filter(function(t) { return t; });
        if (items.length === 0) return '';
        if (items.length === 1) return items[0];
        return items.join('<br>');
      }
      return '';
    }

      { key: 'regular', label: 'Regular', emoji: '\uD83D\uDE10' },
      { key: 'mejorar', label: 'Necesita mejorar', emoji: '\uD83D\uDE1F' }
    ];

      html += '<label class="field-label">Indicadores para el informe</label>';

          });

          inf.indicadores.forEach(function(ind, idx) {
            if (!ind.text.trim()) return;
            var ev = inf.evaluaciones[idx] || {};
            var currentVal = ev['eval' + tri.key] || '';
            html += '<tr><td style="font-weight:600">' + (idx + 1) + '.- ' + escHtml(ind.text) + '</td>';
            INFORME_LEVELS.forEach(function(lv) {

    function addInformeIndicador() {
      pushUndo();
      state.informeFamilias.indicadores.push({ id: uid(), text: '' });
      state.informeFamilias.evaluaciones.push({ eval1T: '', eval2T: '', eval3T: '' });
      markDirty();
      renderFormView();
    }

    function removeInformeIndicador(idx) {
      if (state.informeFamilias.indicadores.length <= 1) return;
      pushUndo();
      state.informeFamilias.indicadores.splice(idx, 1);
      state.informeFamilias.evaluaciones.splice(idx, 1);
      markDirty();
      renderFormView();
      showToast('Indicador del informe eliminado', 'info', { action: 'Deshacer', onAction: undo, duration: 6000 });
    }

    function updateInformeIndicador(idx, value) {
      if (state.informeFamilias.indicadores[idx].text === value) return;
      pushUndo({ coalesce: true });
      state.informeFamilias.indicadores[idx].text = value;
      markDirty();
    }

    function setInformeLevel(idx, trimester, level) {
      if (!state.informeFamilias.evaluaciones[idx]) {
        state.informeFamilias.evaluaciones[idx] = { eval1T: '', eval2T: '', eval3T: '' };
      }
      var ev = state.informeFamilias.evaluaciones[idx];
      var key = 'eval' + trimester;
      pushUndo({ coalesce: true });
      ev[key] = (ev[key] === level) ? '' : level;
      markDirty();
      renderFormView();
    }

    async function clearForm() {
      if (!(await confirmDialog('Se borrarán los objetivos actuales del formulario. Podrás deshacer después.', { title: 'Limpiar formulario', confirmText: 'Limpiar', cancelText: 'Cancelar', danger: true }))) return;
      pushUndo();
      state.areas = state.areas.map(function(a) { return { name: a.name, objectives: [createEmptyObjective()] }; });
      if (state.isNew) {
        state.studentName = '';
        state.course = '';
        state.areas = [];
        state.valoracionInicial = '';
        state.seguimiento1T = '';
        state.seguimiento2T = '';
        state.seguimiento3T = '';
        state.informeFamilias = { indicadores: [], evaluaciones: [] };
      }
      state.dirty = false;
      renderFormView();
      showToast('Formulario limpiado', 'info');
    }

    /* ═══════════════════════════════════════════
       SAVE
    ═══════════════════════════════════════════ */
    var slowSaveTimer = null;
    var SLOW_SAVE_MS = 10000;

    function saveData() {
      // Read latest field values
      state.studentName = document.getElementById('fName').value.trim();
      state.course = document.getElementById('fCourse').value;

      if (!state.studentName) { showToast('Introduce el nombre del alumno/a', 'error'); return; }
      if (!state.course) { showToast('Selecciona un curso', 'error'); return; }
      if (state.areas.length === 0) { showToast('Selecciona al menos un ámbito', 'error'); return; }

      state.saving = true;
      var btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando...';

      clearTimeout(slowSaveTimer);
      slowSaveTimer = setTimeout(function() {
        if (!state.saving) return;
        btn.innerHTML = '<span class="spinner"></span> Aún guardando…';
        showToast('Está tardando más de lo normal. Tus datos están guardados en el borrador local.', 'info', { duration: 5000 });
      }, SLOW_SAVE_MS);

      // Read rich text follow-up fields from contenteditable
      document.querySelectorAll('.richtext-editor').forEach(function(el) {
        var key = el.getAttribute('data-key');
        if (key) state[key] = el.innerHTML;
        var objId = el.getAttribute('data-obj-id');
        var objField = el.getAttribute('data-obj-field');
        if (objId && objField) {
          var found = findObjInAreas(objId);
          if (found) found.obj[objField] = el.innerHTML;
        }
        var citemId = el.getAttribute('data-content-item-id');
        if (objId && citemId) {
          var f2 = findObjInAreas(objId);
          if (f2) {
            var ci = f2.obj.contents.find(function(c) { return c.id === citemId; });
            if (ci) ci.text = el.innerHTML;
          }
        }
      });

      var payload = JSON.stringify({
        studentName: state.studentName,
        course: state.course,
        valoracionInicial: state.valoracionInicial,
        seguimiento1T: state.seguimiento1T,
        seguimiento2T: state.seguimiento2T,
        seguimiento3T: state.seguimiento3T,
        informeFamilias: {
          indicadores: state.informeFamilias.indicadores.filter(function(i) { return i.text.trim(); }),
          evaluaciones: state.informeFamilias.evaluaciones
        },
        areas: state.areas.map(function(area) {
          return {
            name: area.name,
            objectives: area.objectives.map(function(o) {
              return {
                title: o.title,
                eval1T: o.eval1T || '', eval2T: o.eval2T || '', eval3T: o.eval3T || '',
                indicators: o.indicators.filter(function(i) { return i.text.trim(); }).map(function(i) {
                  return { text: i.text, eval1T: i.eval1T || '', eval2T: i.eval2T || '', eval3T: i.eval3T || '', observaciones: i.observaciones || '' };
                }),
                contents: (o.contents || []).map(function(c) { return { text: sanitizeRich(c.text || '') }; }).filter(function(c) { return richHasText(c.text); }),
                activities: sanitizeRich(o.activities || '')
              };
            })
          };
        })
      });

      google.script.run
        .withSuccessHandler(function(result) {
          clearTimeout(slowSaveTimer);
          state.saving = false;
          state.dirty = false;
          state.selectedStudent = state.studentName;
          state.isNew = false;
          clearDraft(state.studentName);

          // Update local students list
          var areaStr = state.areas.map(function(a) { return a.name; }).join(', ');
          var existing = state.students.find(function(s) { return s.name === state.studentName; });
          if (!existing) {
            state.students.push({ name: state.studentName, course: state.course, program: 'PE', area: areaStr });
          } else {
            existing.course = state.course;
            existing.program = 'PE';
            existing.area = areaStr;
          }

          btn.disabled = false;
          btn.innerHTML = svgIcon('save') + ' Guardar';
          updateBadge();
          showToast('Datos guardados en Google Sheets', 'success');
        })
        .withFailureHandler(function(err) {
          clearTimeout(slowSaveTimer);
          state.saving = false;
          btn.disabled = false;
          btn.innerHTML = svgIcon('save') + ' Guardar';
          var msg = (err && err.message) ? err.message : 'No se pudo conectar';
          showToast('Error al guardar: ' + msg + ' · tus datos siguen en el borrador local', 'error', {
            action: 'Reintentar',
            onAction: saveData,
            duration: 10000
          });
        })
        .saveStudentData(payload);
    }

      var html = '<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">';
      html += '<div class="settings-panel">';
      html += '<div class="settings-header"><span class="settings-title">' + ICONS.settings + ' Ajustes del centro</span><button class="settings-close" onclick="closeSettings()" title="Cerrar" aria-label="Cerrar">' + ICONS.x + '</button></div>';
      html += '<div class="settings-body">';
      html += '<div><label class="field-label">Centro educativo</label>';
      html += '<input class="field-input" id="cfgCentro" value="' + escAttr(c.centro || '') + '" placeholder="Ej: CEIP Carlos III"></div>';
      html += '<div><label class="field-label">Localidad</label>';
      html += '<input class="field-input" id="cfgLocalidad" value="' + escAttr(c.localidad || '') + '" placeholder="Ej: La Carlota"></div>';
      html += '<div><label class="field-label">Curso escolar</label>';
      html += '<input class="field-input" id="cfgCurso" value="' + escAttr(c.cursoEscolar || '') + '" placeholder="Ej: 2025/2026 (vacío = automático)"></div>';
      html += '</div>';
      html += '<div class="settings-footer">';
      html += '<button class="btn btn-secondary" onclick="closeSettings()">Cancelar</button>';
      html += '<button class="btn btn-primary" id="btnSaveConfig" onclick="saveConfigFromUI()">Guardar</button>';
      html += '</div></div></div>';

      var wrapper = document.createElement('div');
      wrapper.id = 'settingsWrapper';
      wrapper.innerHTML = html;
      document.body.appendChild(wrapper);
    }

    function closeSettings() {
      var w = document.getElementById('settingsWrapper');
      if (w) w.remove();
    }

    function saveConfigFromUI() {
      var payload = {
        centro: document.getElementById('cfgCentro').value.trim(),
        localidad: document.getElementById('cfgLocalidad').value.trim(),
        cursoEscolar: document.getElementById('cfgCurso').value.trim()
      };
      var btn = document.getElementById('btnSaveConfig');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      google.script.run
        .withSuccessHandler(function() {
          state.config.centro = payload.centro;
          state.config.localidad = payload.localidad;
          if (payload.cursoEscolar) state.config.cursoEscolar = payload.cursoEscolar;
          updateHeaderSubtitle();
          closeSettings();
          showToast('Ajustes del centro guardados', 'success');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Guardar';
          showToast('Error al guardar ajustes: ' + err.message, 'error');
        })
        .saveConfig(JSON.stringify(payload));
    }

    /* ═══════════════════════════════════════════
       UTILS
    ═══════════════════════════════════════════ */
    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function richHasText(html) {
      if (!html) return false;
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      return (tmp.textContent || '').trim().length > 0;
    }
    function escAttr(str) { return escHtml(str); }

    function sanitizeRich(html) {
      if (!html) return '';
      return String(html)
        .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
        .replace(/<(iframe|object|embed|form|style|link|meta)\b[\s\S]*?<\/\1>/gi, '')
        .replace(/<(iframe|object|embed|form|style|link|meta)\b[^>]*\/?>/gi, '')
        .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
        .replace(/\son\w+\s*=\s*'[^']*'/gi, '')
        .replace(/\son\w+\s*=\s*[^\s>]+/gi, '')
        .replace(/(href|src)\s*=\s*"\s*javascript:[^"]*"/gi, '$1=""')
        .replace(/(href|src)\s*=\s*'\s*javascript:[^']*'/gi, '$1=""');
    }

    function getCurrentSchoolYear() {
      var now = new Date();
      var year = now.getFullYear();
      var month = now.getMonth(); // 0-based
      if (month >= 8) { return year + '/' + (year + 1); }
      return (year - 1) + '/' + year;
    }

    function confirmDialog(message, opts) {
      opts = opts || {};
      var title = opts.title || 'Confirmar';
      var confirmText = opts.confirmText || 'Aceptar';
      var cancelText = opts.cancelText || 'Cancelar';
      var danger = opts.danger === true;
      return new Promise(function(resolve) {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML =
          '<div class="modal-box" role="dialog" aria-modal="true">' +
            '<div class="modal-title">' + escHtml(title) + '</div>' +
            '<div class="modal-message">' + escHtml(message) + '</div>' +
            '<div class="modal-actions">' +
              '<button class="modal-btn modal-btn-cancel" data-cancel>' + escHtml(cancelText) + '</button>' +
              '<button class="modal-btn ' + (danger ? 'modal-btn-danger' : 'modal-btn-confirm') + '" data-confirm>' + escHtml(confirmText) + '</button>' +
            '</div>' +
          '</div>';
        function close(result) {
          document.removeEventListener('keydown', onKey);
          overlay.remove();
          resolve(result);
        }
        function onKey(e) {
          if (e.key === 'Escape') { e.preventDefault(); close(false); }
          else if (e.key === 'Enter') { e.preventDefault(); close(true); }
        }
        overlay.addEventListener('click', function(e) { if (e.target === overlay) close(false); });
        overlay.querySelector('[data-cancel]').addEventListener('click', function() { close(false); });
        overlay.querySelector('[data-confirm]').addEventListener('click', function() { close(true); });
        document.addEventListener('keydown', onKey);
        document.body.appendChild(overlay);
        setTimeout(function() {
          var btn = overlay.querySelector('[data-confirm]');
          if (btn) btn.focus();
        }, 10);
      });
    }

    function promptDialog(message, opts) {
      opts = opts || {};
      var title = opts.title || 'Introduce un valor';
      var confirmText = opts.confirmText || 'Aceptar';
      var cancelText = opts.cancelText || 'Cancelar';
      var defaultValue = opts.defaultValue || '';
      var placeholder = opts.placeholder || '';
      var validate = opts.validate || function() { return ''; };
      return new Promise(function(resolve) {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML =
          '<div class="modal-box" role="dialog" aria-modal="true">' +
            '<div class="modal-title">' + escHtml(title) + '</div>' +
            '<div class="modal-message">' + escHtml(message) + '</div>' +
            '<input type="text" class="modal-input" placeholder="' + escAttr(placeholder) + '" value="' + escAttr(defaultValue) + '">' +
            '<div class="modal-error" style="display:none"></div>' +
            '<div class="modal-actions">' +
              '<button class="modal-btn modal-btn-cancel" data-cancel>' + escHtml(cancelText) + '</button>' +
              '<button class="modal-btn modal-btn-confirm" data-confirm>' + escHtml(confirmText) + '</button>' +
            '</div>' +
          '</div>';
        var input = overlay.querySelector('.modal-input');
        var errEl = overlay.querySelector('.modal-error');
        function close(result) {
          document.removeEventListener('keydown', onKey);
          overlay.remove();
          resolve(result);
        }
        function tryConfirm() {
          var v = input.value.trim();
          var err = validate(v);
          if (err) { errEl.textContent = err; errEl.style.display = ''; return; }
          close(v);
        }
        function onKey(e) {
          if (e.key === 'Escape') { e.preventDefault(); close(null); }
          else if (e.key === 'Enter' && document.activeElement === input) { e.preventDefault(); tryConfirm(); }
        }
        overlay.addEventListener('click', function(e) { if (e.target === overlay) close(null); });
        overlay.querySelector('[data-cancel]').addEventListener('click', function() { close(null); });
        overlay.querySelector('[data-confirm]').addEventListener('click', tryConfirm);
        document.addEventListener('keydown', onKey);
        document.body.appendChild(overlay);
        setTimeout(function() { input.focus(); input.select(); }, 10);
      });
    }

    window.addEventListener('beforeunload', function(e) {
      if (state.dirty && !state.saving) {
        saveDraftNow();
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    document.addEventListener('keydown', function(e) {
      // Ctrl/Cmd + S → save when the form is visible
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 's' || e.key === 'S')) {
        if (state.view === 'form' && !state.saving) {
          e.preventDefault();
          saveData();
        }
        return;
      }
      // Ctrl/Cmd + Z → undo · Ctrl/Cmd + Shift + Z o Ctrl + Y → redo.
      // Skip while focus is on a text field so the browser can handle its
      // native undo/redo for typing.
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'z' || e.key === 'Z' || e.key === 'y' || e.key === 'Y')) {
        var ae = document.activeElement;
        var isEditing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable);
        if (isEditing) return;
        if (state.view !== 'form') return;
        var isRedo = e.shiftKey || e.key === 'y' || e.key === 'Y';
        if (isRedo) {
          if (redoStack.length > 0) { e.preventDefault(); redo(); }
        } else {
          if (undoStack.length > 0) { e.preventDefault(); undo(); }
        }
        return;
      }
      // Esc → close print overlay (modal handles its own Esc)
      if (e.key === 'Escape') {
        if (document.querySelector('.modal-overlay')) return;
        if (document.getElementById('printOverlayWrapper')) closePrint();
      }
    });

    var toastTimer = null;
    function showToast(message, type, opts) {
      opts = opts || {};
      var t = document.getElementById('toast');
      while (t.firstChild) t.removeChild(t.firstChild);
      var iconName = type === 'success' ? 'check' : type === 'error' ? 'x' : 'info';
      var iconEl = document.createElement('span');
      iconEl.className = 'toast-icon';
      iconEl.innerHTML = ICONS[iconName] || '';
      t.appendChild(iconEl);
      var span = document.createElement('span');
      span.textContent = message;
      t.appendChild(span);
      var hasAction = opts.action && typeof opts.onAction === 'function';
      if (hasAction) {
        var action = opts.onAction;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toast-action';
        btn.textContent = opts.action;
        btn.addEventListener('click', function(ev) {
          ev.preventDefault();
          ev.stopPropagation();
          clearTimeout(toastTimer);
          t.style.display = 'none';
          try { action(); } catch (err) { /* noop */ }
        });
        t.appendChild(btn);
      }
      t.className = 'toast toast-' + (type || 'info');
      t.style.display = '';
      clearTimeout(toastTimer);
      var duration = opts.duration || 3000;
      if (hasAction) {
        var bar = document.createElement('div');
        bar.className = 'toast-progress';
        t.appendChild(bar);
        // Force reflow so the transition registers from scaleX(1) → scaleX(0).
        void bar.offsetWidth;
        bar.style.transition = 'transform ' + duration + 'ms linear';
        bar.style.transform = 'scaleX(0)';
      }
      toastTimer = setTimeout(function() { t.style.display = 'none'; }, duration);
    }
  </script>
